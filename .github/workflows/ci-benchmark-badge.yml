name: ci-benchmark-badge

# Regenerate the shields.io endpoint badge JSONs from
# benchmarks/badges/sources.json and commit them to this branch.
# Benchmark numbers themselves are measured on the project's Zen4
# reference host (see BENCHMARKING.md) and recorded in sources.json by
# hand; this workflow only materializes the endpoint files.

on:
  workflow_dispatch:
  push:
    branches: [feat/ci-benchmark-badge]
    paths: [benchmarks/badges/sources.json]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ci-benchmark-badge
      - name: Regenerate badge JSONs
        run: node scripts/update-benchmark-badges.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/badges/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "ci(benchmark-badge): regenerate endpoint JSONs from sources.json"
            git push origin feat/ci-benchmark-badge
          fi
