name: ci-benchmark-badge

# Measure benchmark numbers on the CI runner and refresh the CI-column
# shields.io badges. Badge JSONs live in a public gist (updated via the
# Gists API with the BADGE_GIST_TOKEN fine-grained PAT — a repo-scoped
# workflow token cannot push in a fork, and the gist keeps any
# repo-write credential out of CI). The Zen4 reference-host badges
# (sources.json on the feat/ci-benchmark-badge branch) are hand-recorded
# and untouched by this job.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-benchmark-badge
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Build A1 bench
        working-directory: repo/gf64/test
        run: make bench_gf64_subquadratic

      - name: Run A1 bench (CI mode)
        working-directory: repo/gf64/test
        run: |
          set -o pipefail
          PAR3_CI_BENCH=1 ./bench_gf64_subquadratic 2>&1 | tee /tmp/a1.log
          grep 'N=131072' /tmp/a1.log

      - name: Parse A1 numbers
        run: |
          # The phase line is the only one carrying 'tree=' (the gate line
          # also contains N=131072 but no tree=).
          LINE=$(grep 'N=131072' /tmp/a1.log | grep 'tree=')
          echo "TREE=$(echo "$LINE" | sed -E 's/.*tree=([0-9.]+)s.*/\1/')" >> "$GITHUB_OUTPUT"
          echo "MPE=$(echo "$LINE" | sed -E 's/.*mpe=([0-9.]+)s.*/\1/')" >> "$GITHUB_OUTPUT"
          echo "INTERP=$(echo "$LINE" | sed -E 's/.*interp=([0-9.]+)s.*/\1/')" >> "$GITHUB_OUTPUT"
        id: parse

      - name: Create bench (1 GiB / 1 MiB, R=8)
        working-directory: repo
        run: |
          set -o pipefail
          # Full install (devDeps included): the addon rebuild needs node-gyp
          # and the root package's prepare script runs husky — both live in
          # devDependencies, so --production would break this step.
          npm ci --no-audit --no-fund
          node scripts/ci-bench-create.js 2>&1 | tee /tmp/create.log

      - name: Parse create number
        run: |
          CREATE=$(grep '^create-1g-1m:' /tmp/create.log | sed -E 's/.*: ([0-9.]+) MB\/s.*/\1/')
          echo "CREATE=$CREATE" >> "$GITHUB_OUTPUT"
        id: parsecreate

      - name: Update sources-ci.json
        working-directory: repo
        env:
          CI_CREATE_MBS: ${{ steps.parsecreate.outputs.CREATE }}
          CI_TREE_S: ${{ steps.parse.outputs.TREE }}
          CI_MPE_S: ${{ steps.parse.outputs.MPE }}
          CI_INTERP_S: ${{ steps.parse.outputs.INTERP }}
        run: node scripts/update-sources-ci.js

      - name: Regenerate endpoint JSONs
        working-directory: repo
        run: node scripts/update-benchmark-badges.js

      - name: Update CI badge gist
        working-directory: repo
        env:
          GIST_TOKEN: ${{ secrets.BADGE_GIST_TOKEN }}
          GIST_ID: de34e89a8dda313fba9565f56ba7767b
        run: |
          set -o pipefail
          # One object per file merged into a single gist update ('*' is the
          # recursive object merge — '+' would collapse files to the last);
          # shields.io serves the /raw/ (latest-revision) URLs from the README.
          BODY=$(
            for f in benchmarks/badges/ci-*.json benchmarks/badges/sources-ci.json; do
              jq -n --arg name "$(basename "$f")" --rawfile c "$f" \
                '{files: {($name): {content: $c}}}'
            done | jq -s 'reduce .[] as $o ({}; . * $o)'
          )
          # -d @file (not -d "$BODY") so the JSON's quotes/escapes survive
          # shell→curl argument passing on every platform.
          printf '%s' "$BODY" > /tmp/gist-body.json
          curl -sf -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/gist-body.json -o /tmp/gist-resp.json
          jq -r '"gist updated: " + .html_url' /tmp/gist-resp.json
