name: ci-benchmark-badge

# Monthly (30th, 20:00 UTC) benchmark of the README badge table's CI
# column: four create legs on the shared runner, one job per leg (each
# gets its own 6 h budget; legs run in parallel so wall time is the
# slowest leg), then a publish job combines the numbers into
# sources-ci.json, regenerates the endpoint JSONs and PATCHes the public
# badge gist (fork workflow tokens are read-only, so the gist — updated
# with the gists-only BADGE_GIST_TOKEN — keeps any repo-write credential
# out of CI). The two 10 GiB rows are kernel-bound beyond 6 h and stay
# "N/A >6h". The Zen4 reference-host badges (sources.json on the
# feat/ci-benchmark-badge branch) are hand-recorded and untouched.

on:
  schedule:
    - cron: '0 20 30 * *'
  workflow_dispatch:

concurrency:
  group: ci-benchmark-badge
  cancel-in-progress: false

jobs:
  par2-1g-32k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Leg — PAR2 1 GiB / 32768 slices
        working-directory: repo
        run: |
          set -o pipefail
          node test/bench/par2-create-bench.js --size=1G --slices=32768 --recovery=8 2>&1 | tee /tmp/par2.log
          grep -oE 'Throughput: [0-9.]+' /tmp/par2.log | grep -oE '[0-9.]+$'
          echo "MBS=$(grep -oE 'Throughput: [0-9.]+' /tmp/par2.log | grep -oE '[0-9.]+$')" >> "$GITHUB_OUTPUT"
        id: leg
    outputs:
      MBS: ${{ steps.leg.outputs.MBS }}

  par3-1g-32k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h / | tail -1
      - name: Install deps (addon build)
        working-directory: repo
        run: npm ci --no-audit --no-fund
      - name: Leg — PAR3 1 GiB / 32768 slices (32 KiB blocks)
        working-directory: repo
        run: |
          set -o pipefail
          node test/bench/par3-create-bench.js --size=1G --slices=32768 --block-size=32768 --recovery=8 2>&1 | tee /tmp/p3-32k.log
          echo "MBS=$(grep -oE 'Throughput: [0-9.]+' /tmp/p3-32k.log | grep -oE '[0-9.]+$')" >> "$GITHUB_OUTPUT"
        id: leg
    outputs:
      MBS: ${{ steps.leg.outputs.MBS }}

  par3-1g-131072:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h / | tail -1
      - name: Install deps (addon build)
        working-directory: repo
        run: npm ci --no-audit --no-fund
      - name: Leg — PAR3 1 GiB / 131072 slices (8 KiB blocks)
        working-directory: repo
        run: |
          set -o pipefail
          node test/bench/par3-create-bench.js --size=1G --slices=131072 --block-size=8192 --recovery=8 2>&1 | tee /tmp/p3-131072.log
          echo "MBS=$(grep -oE 'Throughput: [0-9.]+' /tmp/p3-131072.log | grep -oE '[0-9.]+$')" >> "$GITHUB_OUTPUT"
        id: leg
    outputs:
      MBS: ${{ steps.leg.outputs.MBS }}

  par3-1g-262144:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h / | tail -1
      - name: Install deps (addon build)
        working-directory: repo
        run: npm ci --no-audit --no-fund
      - name: Leg — PAR3 1 GiB / 262144 slices (4 KiB blocks)
        working-directory: repo
        run: |
          set -o pipefail
          node test/bench/par3-create-bench.js --size=1G --slices=262144 --block-size=4096 --recovery=8 2>&1 | tee /tmp/p3-262144.log
          echo "MBS=$(grep -oE 'Throughput: [0-9.]+' /tmp/p3-262144.log | grep -oE '[0-9.]+$')" >> "$GITHUB_OUTPUT"
        id: leg
    outputs:
      MBS: ${{ steps.leg.outputs.MBS }}

  publish:
    runs-on: ubuntu-latest
    needs: [par2-1g-32k, par3-1g-32k, par3-1g-131072, par3-1g-262144]
    # Publish whatever legs completed; a timed-out leg leaves its badge
    # at the committed "pending" state instead of failing the month.
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Update sources-ci.json
        working-directory: repo
        env:
          CI_PAR2_1G_32K_MBS: ${{ needs.par2-1g-32k.outputs.MBS }}
          CI_PAR3_1G_32K_MBS: ${{ needs.par3-1g-32k.outputs.MBS }}
          CI_PAR3_1G_131072_MBS: ${{ needs.par3-1g-131072.outputs.MBS }}
          CI_PAR3_1G_262144_MBS: ${{ needs.par3-1g-262144.outputs.MBS }}
        run: node scripts/update-sources-ci.js

      - name: Regenerate endpoint JSONs
        working-directory: repo
        run: node scripts/update-benchmark-badges.js

      - name: Update CI badge gist
        working-directory: repo
        env:
          GIST_TOKEN: ${{ secrets.BADGE_GIST_TOKEN }}
          GIST_ID: de34e89a8dda313fba9565f56ba7767b
        run: |
          set -o pipefail
          # One object per file merged into a single gist update ('*' is the
          # recursive object merge — '+' would collapse files to the last);
          # shields.io serves the /raw/ (latest-revision) URLs from the README.
          BODY=$(
            for f in benchmarks/badges/*-ci.json benchmarks/badges/sources-ci.json; do
              jq -n --arg name "$(basename "$f")" --rawfile c "$f" \
                '{files: {($name): {content: $c}}}'
            done | jq -s 'reduce .[] as $o ({}; . * $o)'
          )
          # -d @file (not -d "$BODY") so the JSON's quotes/escapes survive
          # shell→curl argument passing on every platform.
          printf '%s' "$BODY" > /tmp/gist-body.json
          curl -sf -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/gist-body.json -o /tmp/gist-resp.json
          jq -r '"gist updated: " + .html_url' /tmp/gist-resp.json
