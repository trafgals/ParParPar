name: debug-62

# TEMPORARY issue #62 root-cause workflow — DELETED before the PR.
# Triggered by pushes to the debug branch (GitHub refuses to dispatch
# workflows that don't exist on the default branch), never on PRs.
# Reproduces the Node-20 + windows-2025 Fenger crash (N=1/R=2 create)
# under a knob matrix so the failing combination can be isolated.
on:
  push:
    branches: [perf/issue-59-p2-a3-word-batched]

jobs:
  repro-node20:
    name: '#62 repro (windows-2025, node 20)'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Native addon load gate
        shell: bash
        run: node -e "var m=require('./build/Release/parpar_gf64.node'); console.log('OK exports:', Object.keys(m).length);"

      - name: Engine repro — knob matrix
        shell: bash
        run: |
          set +e
          # forceavx512 is only meaningful on a runner whose CPUID probe
          # reports AVX-512; forcing AVX-512 on a non-AVX-512 CPU is a
          # guaranteed SIGILL by design, so gate it on the detection.
          DET=$(node -e "var m=require('./build/Release/parpar_gf64.node'); process.stdout.write((m.gf64_info()||{}).name||'')" 2>/dev/null)
          echo "runner detection: $DET"
          bad=0
          for combo in default noavx512; do
            case $combo in
              default)      unset PAR3_GF64_USE_AVX512 PAR3_AVX512_FORCE;;
              noavx512)     export PAR3_GF64_USE_AVX512=0; unset PAR3_AVX512_FORCE;;
            esac
            node test/repro-62.js > "repro-$combo.log" 2>&1
            rc=$?
            echo "=== combo=$combo exit=$rc ==="
            cat "repro-$combo.log"
            [ $rc -ne 0 ] && bad=1
          done
          if [ "$DET" = "AVX512" ]; then
            export PAR3_GF64_USE_AVX512=1 PAR3_AVX512_FORCE=2
            node test/repro-62.js > repro-forceavx512.log 2>&1
            echo "=== combo=forceavx512 exit=$? (runner has AVX-512: expected to pass) ==="
            cat repro-forceavx512.log
          else
            echo "=== combo=forceavx512 SKIPPED (runner has no AVX-512; forcing it would SIGILL by design) ==="
          fi
          # Faulting-module details from the Windows Application event log
          # (no admin/registry needed) — pinpoints the crashing function.
          # (\$_ escapes MSYS's last-argument expansion of $_.)
          powershell -Command "Get-WinEvent -LogName Application -MaxEvents 12 | Where-Object { \$_.ProviderName -match 'Application Error|Windows Error Reporting' } | Select-Object -First 2 | ForEach-Object { \$_.Message }" 2>&1 | head -40
          exit $bad

      - name: Full create repro (original crash path)
        shell: bash
        run: |
          set +e
          mkdir -p par3-test-input par3-test-output
          echo "one" > par3-test-input/file1.txt
          export PAR3_FENGER_WINDOWS_ENABLE=1
          node bin/par3.js create --output par3-test-output/data --recovery-slices 2 par3-test-input/file1.txt > create-enable.log 2>&1
          echo "=== create (A4 enable only) exit=$? ==="
          cat create-enable.log
          export PAR3_GF64_USE_FENGER=1
          node bin/par3.js create --output par3-test-output/data2 --recovery-slices 2 par3-test-input/file1.txt > create-force.log 2>&1
          echo "=== create (enable + force) exit=$? ==="
          cat create-force.log
          ls -la par3-test-output 2>/dev/null

  repro-node22:
    name: '#62 repro (windows-2025, node 22)'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Engine repro — knob matrix
        shell: bash
        run: |
          set +e
          DET=$(node -e "var m=require('./build/Release/parpar_gf64.node'); process.stdout.write((m.gf64_info()||{}).name||'')" 2>/dev/null)
          echo "runner detection: $DET"
          bad=0
          unset PAR3_GF64_USE_AVX512 PAR3_AVX512_FORCE
          node test/repro-62.js > repro22-default.log 2>&1
          rc=$?
          echo "=== node22 combo=default exit=$rc ==="
          cat repro22-default.log
          [ $rc -ne 0 ] && bad=1
          if [ "$DET" = "AVX512" ]; then
            export PAR3_GF64_USE_AVX512=1 PAR3_AVX512_FORCE=2
            node test/repro-62.js > repro22-forceavx512.log 2>&1
            echo "=== node22 combo=forceavx512 exit=$? (runner has AVX-512: expected to pass) ==="
            cat repro22-forceavx512.log
          else
            echo "=== node22 combo=forceavx512 SKIPPED (runner has no AVX-512) ==="
          fi
          exit $bad
