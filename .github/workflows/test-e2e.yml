name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-e2e:
    name: Run E2E Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf par2

      - name: Install Node dependencies
        run: npm install

      - name: Build native binding
        run: npx node-gyp rebuild

      - name: Build par3cmdline (PAR3 cross-compat reference)
        # e2e-par3-cross-compat.js SKIPs Tests A/B/F without the reference
        # binary at test/fixtures/par3cmdline-bin/par3. Build it from source
        # (Parchive/par3cmdline) so the cross-compat matrix runs for real.
        # Requires cmake + C/C++ toolchain (preinstalled on ubuntu runners).
        run: bash test/fixtures/par3cmdline-bin/build.sh

      - name: Run E2E tests
        run: npm run test:e2e